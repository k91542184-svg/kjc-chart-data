name: KJC 차트 데이터 수집

on:
  schedule:
    - cron: "0 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kjc-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install "yfinance>=0.2.40" pandas

      - name: 데이터 수집
        run: python scripts/build_kjc_data.py

      - name: 변경분 커밋
        run: |
          git config user.name  "kjc-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋하지 않습니다."
          else
            git commit -m "데이터 갱신 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
