name: KJC 차트 데이터 수집

on:
  schedule:
    - cron: "0 23 * * 1-5"   # 한국 08:00 (화~토)
    - cron: "0 4 * * 1-5"    # 한국 13:00 (월~금) — 앱에서 새로 추가한 종목을 당일 수집
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kjc-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install "yfinance>=0.2.40" pandas

      - name: 앱 관심종목 합치기 (구글 드라이브 파일 이름)
        env:
          WATCH_ID: 1Y1OH9g0cRo0mbCqMvGrTwRd_jaGgqL7y
        run: |
          python - <<'PY'
          import re, urllib.request
          url = "https://drive.google.com/file/d/%s/view" % __import__("os").environ["WATCH_ID"]
          try:
              html = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"}), timeout=30).read().decode("utf-8", "ignore")
          except Exception as e:
              print("관심종목 파일을 읽지 못함:", e); raise SystemExit(0)
          m = re.search(r"KJC_WATCHLIST ([A-Z0-9.,\-]+)", html)
          if not m:
              print("관심종목 목록을 찾지 못함 — tickers.txt 만 사용"); raise SystemExit(0)
          ticks = [t for t in m.group(1).split(",") if re.fullmatch(r"[A-Z0-9.\-]{1,10}", t)]
          with open("tickers.txt", "a", encoding="utf-8") as f:
              f.write("\n# --- 앱 관심종목 (자동) ---\n" + "\n".join(ticks) + "\n")
          print("앱 관심종목 %d개 합침: %s" % (len(ticks), ",".join(ticks)))
          PY

      - name: 데이터 수집
        run: python scripts/build_kjc_data.py

      - name: 30분봉 수집 (최근 60일)
        run: python scripts/build_kjc_30m.py || echo "30분봉 수집 실패 — 일봉은 계속 진행"

      - name: 변경분 커밋
        run: |
          git config user.name  "kjc-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data data30
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋하지 않습니다."
          else
            git commit -m "데이터 갱신 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
